  <style>
    :root {
      --accent: #ec4899;
      --accent-2: #ffd700;
      --glow: rgba(236,72,153,.35);
      --surface-tint: rgba(236,72,153,.07);
      --font-display: 'Space Grotesk', system-ui, sans-serif;
      --hero-img: url('/images/hero-rickroll.webp');
    }
    /* This page has no nav and no sections — it is a single centred moment. */
    .stage {
      min-height: 100vh; display: grid; place-items: center; text-align: center;
      padding: 3rem 1.5rem;
      background:
        radial-gradient(ellipse 70% 55% at 30% 20%, var(--glow), transparent 60%),
        radial-gradient(ellipse 60% 50% at 78% 80%, rgba(255,215,0,.18), transparent 55%),
        linear-gradient(180deg, rgba(8,9,13,.62), rgba(8,9,13,.88)),
        var(--hero-img) center / cover no-repeat,
        var(--bg);
    }
    .stage-inner { max-width: 720px; width: 100%; }
    .stage .logo { height: 84px; width: auto; margin: 0 auto 2rem; filter: drop-shadow(0 0 18px var(--glow)); }
    .stage h1 {
      font-family: var(--font-display); font-weight: 700; letter-spacing: -.03em;
      font-size: clamp(2rem, 6vw, 3.25rem); line-height: 1.05; margin-bottom: .75rem;
      background: linear-gradient(120deg, var(--text) 20%, var(--accent) 60%, var(--accent-2) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      padding-bottom: .08em;
    }
    .stage .sub { color: var(--text-dim); margin-bottom: 2.25rem; font-size: 1.05rem; }
    .video {
      position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;
      border-radius: var(--radius); border: 1px solid var(--line);
      box-shadow: 0 0 60px -20px var(--glow); margin-bottom: 2rem;
    }
    .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .stage .outro { color: var(--text-faint); font-size: .9rem; margin-bottom: 1.75rem; }
  </style>
